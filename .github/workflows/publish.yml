name: Publish to pub.dev

# Publishes terra_flutter_bridge to pub.dev when a version tag is pushed.
# Auth uses pub.dev's GitHub Actions OIDC — no long-lived token/secret. The
# package must have "Automated publishing" enabled on pub.dev (Admin tab) with
# this repository and the tag pattern v{{version}} (e.g. v0.9.3).
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required for pub.dev OIDC auth
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - run: flutter pub get
      - name: Publish
        run: flutter pub publish --force
